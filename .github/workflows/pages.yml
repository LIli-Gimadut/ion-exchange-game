name: Publish browser game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install browser packager
        run: python -m pip install pygbag==0.9.3

      - name: Prepare browser sources
        run: |
          mkdir webapp
          cp main.py webapp/
          cp -R assets chemistry game webapp/

      - name: Build WebAssembly game
        run: >-
          python -m pygbag --build --ume_block 0
          --template web/index.tmpl
          --title "Реакции ионного обмена" webapp

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: webapp/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
